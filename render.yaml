# Example Render Blueprint for the API
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ux-portfolio-api
    runtime: node
    rootDir: apps/api
    buildCommand: cd ../.. && npm install && npm run build:shared && npm run build -w @ux-portfolio/api
    startCommand: npm run start -w @ux-portfolio/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false
      - key: WEB_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
